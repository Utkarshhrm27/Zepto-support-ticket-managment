version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000,http://frontend:5173
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./backend/tickets.db:/app/tickets.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
